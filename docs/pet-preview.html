<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>agentmon 宠物预览 · 极光罗盘猫</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,"PingFang SC",sans-serif;background:#12141a;color:#e8eaed;text-align:center}
  h1{font-size:20px;margin:20px 0 4px}h2{font-size:16px;margin:28px 0 8px}
  .muted{color:#9aa0aa;font-size:13px;margin:0 0 12px}
  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}
  select,button{background:#1c2029;color:#e8eaed;border:1px solid #2a2f3a;border-radius:8px;padding:8px 12px;font-size:14px}
  canvas{background:radial-gradient(circle at 50% 42%,#1b2030,#0b0d12);border-radius:16px;margin:10px auto;display:block;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:8px auto;padding:0 16px}
  .cell{background:#eef1f6;border:2px solid #262b36;border-radius:14px;padding:8px}
  .cell img{width:100%;height:auto;display:block}
  .cell .name{font-size:12px;color:#2a2f3a;margin-top:4px;font-weight:600}
  footer{color:#6b7280;font-size:12px;margin:24px}
  a{color:#ff8a12}
</style></head><body>
<h1>agentmon 宠物预览 · 极光罗盘猫</h1>
<p class="muted">单角色 8 套动作动画 + 12 元素收藏 · 原创素材，非任何既有 IP</p>
<div class="controls">
  <select id="action"></select>
  <button id="play">⏸ 暂停</button>
  <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
</div>
<canvas id="c" width="320" height="320"></canvas>

<h2>元素图鉴（12）</h2>
<p class="muted">养成毕业即解锁；活体桌宠为通用动画，元素以静态立绘收藏。</p>
<div id="gallery" class="gallery"></div>

<footer>agentmon · <a href="index.html">返回首页</a></footer>
<script>
var BASE = "pets_raster/";
var cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
var actionSel = document.getElementById("action"), speedSel = document.getElementById("speed");
var playBtn = document.getElementById("play"), playing = true;
var M = null, strips = {}, cur = null;

function loadStrip(act) {
  if (strips[act.file]) return strips[act.file];
  var img = new Image(); img.src = BASE + act.file;
  strips[act.file] = img; return img;
}

function draw(ts) {
  requestAnimationFrame(draw);
  if (!M || !cur) return;
  var act = M.actions[cur];
  var img = loadStrip(act);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  if (!img.complete || !img.naturalWidth) return;
  var fw = img.naturalWidth / act.frames, fh = img.naturalHeight;
  var speed = parseFloat(speedSel.value);
  var t = playing ? ts / 1000 : (window._frozen || 0);
  if (playing) window._frozen = t;
  var i = Math.floor(t * act.fps * speed) % act.frames;
  var scale = Math.min(cvs.width / fw, cvs.height / fh) * 0.92;
  var w = fw * scale, h = fh * scale;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, i * fw, 0, fw, fh, (cvs.width - w) / 2, cvs.height - h - 8, w, h);
}

playBtn.onclick = function () {
  playing = !playing;
  playBtn.textContent = playing ? "⏸ 暂停" : "▶ 播放";
};
actionSel.onchange = function () { cur = actionSel.value; };

var ACTION_CN = {idle:"发呆(rest)",working:"干活(run)",waiting:"等待(sleep)",complete:"完成(cheer)",
  evolve:"进化(happy)",hungry:"饿了(hungry)",jump:"跳跃(jump)",skill:"技能(skill)"};
var ORDER = ["idle","working","waiting","complete","evolve","hungry","jump","skill"];

fetch(BASE + "manifest.json").then(function (r) { return r.json(); }).then(function (m) {
  M = m;
  var keys = ORDER.filter(function (k) { return m.actions[k]; });
  keys.forEach(function (k) {
    var o = document.createElement("option"); o.value = k; o.textContent = ACTION_CN[k] || k;
    actionSel.appendChild(o);
  });
  cur = keys[0];
  var g = document.getElementById("gallery");
  (m.elements || []).forEach(function (e) {
    var d = document.createElement("div"); d.className = "cell";
    d.style.borderColor = e.tint;
    var im = document.createElement("img"); im.src = BASE + e.portrait; im.alt = e.name;
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = e.name;
    d.appendChild(im); d.appendChild(nm); g.appendChild(d);
  });
  requestAnimationFrame(draw);
}).catch(function () {
  document.querySelector(".muted").textContent = "无法加载 manifest（请在 Pages/HTTP 环境查看）";
});
</script></body></html>
